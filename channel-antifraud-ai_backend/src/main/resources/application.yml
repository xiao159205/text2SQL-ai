server:
  port: 8080
  servlet:
    jsp:
      registered: false


spring:
  application:
    name: channel-antifraud-ai-backend
  http:
    client:
      factory: jdk
  datasource:
    # 系统配置库；与用户在页面选择的业务查询库相互独立。
    url: ${MYSQL_URL:jdbc:mysql://hadoop105:3306/cfrm_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:xiao159205}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      read-only: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: sk-40a13f1437b540728c77a12fcf92461d
      chat:
        api-key: sk-40a13f1437b540728c77a12fcf92461d
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

text2sql:
  hive:
    url: ${HIVE_URL:jdbc:hive2://hadoop105:10000/default}
    username: ${HIVE_USERNAME:xym}
    password: ${HIVE_PASSWORD:}
    driver-class-name: org.apache.hive.jdbc.HiveDriver
    maximum-pool-size: ${HIVE_MAXIMUM_POOL_SIZE:5}
    connection-timeout: ${HIVE_CONNECTION_TIMEOUT:10000}
  # 空数组表示读取当前数据库中的全部表；生产环境建议配置白名单
  allowed-tables: []
  schema-cache-seconds: 300
  max-schema-columns: 5000
  max-result-rows: 1000
  max-conditions: 30
  max-joins: 5
  # 开发环境全链路日志；生产环境应关闭完整Prompt和结果数据
  log-full-prompt: true
  log-model-response: true
  log-query-results: true
  max-logged-result-rows: 20

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-system}] %logger{40} - %msg%n"
  level:
    com.xym.antifraud: INFO

app:
  knowledge:
    # ES 7.6.1使用BM25与dense_vector script_score混合召回。
    enabled: ${KNOWLEDGE_ENABLED:true}
    base-url: ${ELASTICSEARCH_URL:http://hadoop105:9200}
    index-name: ${KNOWLEDGE_INDEX:channel-antifraud-knowledge}
    initialize-index: true
    # 混合召回30~100条，Reranker最终保留5~10条。
    candidate-k: ${KNOWLEDGE_CANDIDATE_K:50}
    top-k: ${KNOWLEDGE_TOP_K:8}
    max-context-chars: 8000
    bm25-weight: ${KNOWLEDGE_BM25_WEIGHT:0.45}
    vector-weight: ${KNOWLEDGE_VECTOR_WEIGHT:0.55}
    rrf-k: ${KNOWLEDGE_RRF_K:60}
    query-rewrite-enabled: ${KNOWLEDGE_QUERY_REWRITE_ENABLED:true}
    rerank-enabled: ${KNOWLEDGE_RERANK_ENABLED:true}
    # SiliconFlow Qwen3 Embedding；沿用现有ES dense_vector的1536维映射。
    embedding-enabled: true
    embedding-base-url: https://api.siliconflow.cn/v1
    embedding-api-key: sk-rvpatyrxtezwisxmqesrpmizsrurlcpmnhubuatfdavzscgv
    embedding-model: Qwen/Qwen3-Embedding-8B
    embedding-dimensions: 1536
  knowledge-files:
    storage-directory: ${KNOWLEDGE_FILE_DIRECTORY:./data/knowledge-files}
    max-file-bytes: 20971520
    max-extracted-chars: 2000000
    chunk-chars: 30000
    chunk-overlap-chars: 1000
    max-chunks: 500
  chat-memory:
    # 每次生成新AST时携带最近几轮对话；上限20轮，避免Prompt无限增长。
    recent-rounds: 6
  storage:
    # 头像写入前端源码目录；数据库仅保存 src/asserts/<文件名>。
    avatar-directory: ${AVATAR_DIRECTORY:../channel-antifraud-ai-frontend/src/asserts}
